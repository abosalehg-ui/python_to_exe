name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      # No PyQt5 here: the core modules are UI-free by design, and this job
      # proves it stays that way. The GUI suite runs in the `gui` job below.
      - name: Run core tests
        run: >
          pytest tests/ -v -m "not slow"
          --cov=py2exe_gui.core --cov-report=term
          --cov-fail-under=90

  gui:
    name: GUI tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries for offscreen Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # main_window.py had zero coverage before these tests existed.
      - name: Run GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          pytest tests/ -v -m "not slow"
          --cov=py2exe_gui --cov-report=term

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check py2exe_gui/ tests/

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      # Reports known advisories for the declared requirements. Does not fail
      # the build on its own: a transitive advisory with no fix available
      # should be visible, not a merge blocker.
      - name: Audit declared dependencies
        continue-on-error: true
        run: pip-audit --requirement requirements-dev.txt --desc
