[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py2exe-gui"
version = "1.6.0"
description = "Arabic-localized PyQt5 GUI to convert Python scripts to Windows executables via PyInstaller"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "عبدالكريم العبود", email = "abo.saleh.g@gmail.com" }]
license = { text = "Proprietary" }
keywords = ["pyinstaller", "exe", "converter", "gui", "arabic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Build Tools",
    "Natural Language :: Arabic",
]
dependencies = [
    "PyQt5>=5.15",
    # 6.0 is the floor: --optimize only exists from 6.0 onwards, and 6.0 also
    # carries the fix for the onefile temp-dir privilege issue in earlier lines.
    "pyinstaller>=6.0",
    # The project file is TOML: tomllib is in the standard library from 3.11.
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Stores the GitHub token in the OS credential store (Windows Credential
# Manager, macOS Keychain, Secret Service). Without it, GITHUB_TOKEN is used.
release = [
    "keyring>=23",
]
# 2.0: the Nuitka build engine (also offered, with consent, on first use).
# "onefile" is upstream's extra: zstandard, to compress one-file builds.
nuitka = [
    "nuitka[onefile]>=4.2,<5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "PyYAML>=6.0",
]

[project.scripts]
py2exe-gui = "py2exe_gui.app:main"

[tool.setuptools.packages.find]
# p2e_runtime is the Runtime Kit embedded in users' EXEs: a separate,
# standard-library-only package (publishable on its own later).
include = ["py2exe_gui*", "p2e_runtime*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
# The doctor's knowledge base is data, not code; it must ship in the wheel.
py2exe_gui = ["knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: runs a real PyInstaller build (minutes); deselect with -m 'not slow'",
    "gui: needs PyQt5; runs headless via QT_QPA_PLATFORM=offscreen",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"py2exe_gui/strings.py" = ["E501"]
