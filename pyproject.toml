[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py2exe-gui"
version = "2.1.0"
description = "Arabic-first Qt (PySide6) GUI and command line to turn Python scripts into executables with PyInstaller or Nuitka"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "عبدالكريم العبود", email = "abo.saleh.g@gmail.com" }]
license = { text = "Proprietary" }
keywords = ["pyinstaller", "exe", "converter", "gui", "arabic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Build Tools",
    "Natural Language :: Arabic",
]
dependencies = [
    # The GUI's Qt binding (LGPL-3.0). PyQt5 (GPL-3.0 or commercial) is the
    # optional fallback below; py2exe_gui/qt.py picks whichever is installed.
    # 6.5 is the first line with wheels for every Python this project supports.
    # 6.12.0 is excluded below Python 3.12: it over-releases True/False on
    # every signal emission and aborts the process ("bool_dealloc") after a
    # few thousand emissions (a build log is enough); 3.12+ has immortal
    # bools and is unaffected. Measured on 6.10.3, 6.11.2 (fine) and 6.12.0.
    "PySide6>=6.5,<6.12; python_version < '3.12'",
    "PySide6>=6.5; python_version >= '3.12'",
    # 6.0 is the floor: --optimize only exists from 6.0 onwards, and 6.0 also
    # carries the fix for the onefile temp-dir privilege issue in earlier lines.
    "pyinstaller>=6.0",
    # The project file is TOML: tomllib is in the standard library from 3.11.
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
# 2.0: PyQt5 instead of PySide6 (``pip install py2exe-gui[pyqt5]`` and then
# remove PySide6, or set QT_API=pyqt5). The code runs unchanged on both.
pyqt5 = [
    "PyQt5>=5.15",
]
# Stores the GitHub token in the OS credential store (Windows Credential
# Manager, macOS Keychain, Secret Service). Without it, GITHUB_TOKEN is used.
release = [
    "keyring>=25.7.0",
]
# 2.0: the Nuitka build engine (also offered, with consent, on first use).
# "onefile" is upstream's extra: zstandard, to compress one-file builds.
nuitka = [
    "nuitka[onefile]>=4.2,<5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "PyYAML>=6.0",
]

[project.scripts]
py2exe-gui = "py2exe_gui.app:main"

[tool.setuptools.packages.find]
# p2e_runtime is the Runtime Kit embedded in users' EXEs: a separate,
# standard-library-only package (publishable on its own later).
include = ["py2exe_gui*", "p2e_runtime*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
# The doctor's knowledge base is data, not code; it must ship in the wheel.
# The icons (Lucide, ISC; icons/LICENSE) are rendered at runtime from SVG.
py2exe_gui = ["knowledge/*.json", "icons/*.svg", "icons/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: runs a real PyInstaller build (minutes); deselect with -m 'not slow'",
    "gui: needs a Qt binding (PySide6 or PyQt5); runs headless via QT_QPA_PLATFORM=offscreen",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"py2exe_gui/strings.py" = ["E501"]
